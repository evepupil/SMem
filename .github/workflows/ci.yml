name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run unit and e2e tests (Unix with race detector)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      - name: Run unit and e2e tests (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

      - name: Build binary smoke check
        shell: bash
        run: |
          BIN="smem"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="smem.exe"
          fi
          go build -o "./${BIN}" ./cmd/smem
          "./${BIN}" version
