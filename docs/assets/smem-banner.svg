<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" shape-rendering="crispEdges" role="img" aria-label="SMem — 通用 AI 编程 Agent 统一记忆底座">
  <defs>
    <style>
      .sans { font-family: "Inter Tight", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="1200" height="360" fill="#F3ACF0"/>
  <rect x="1.5" y="1.5" width="1197" height="357" fill="none" stroke="#0A0A0A" stroke-width="3"/>

  <!-- Top Status Strip -->
  <rect x="0" y="0" width="1200" height="44" fill="#0A0A0A"/>
  <text x="28" y="27" fill="#F3ACF0" font-size="13" font-weight="600" class="mono">[SMEM // v2.0.0]</text>
  <text x="220" y="27" fill="#FFFFFF" font-size="12" font-weight="500" class="mono">LOCAL-FIRST CROSS-AGENT MEMORY LAYER</text>
  <rect x="976" y="10" width="196" height="24" fill="#F3ACF0"/>
  <text x="1074" y="26" text-anchor="middle" fill="#0A0A0A" font-size="12" font-weight="700" class="mono">SMEM.CHAOSYN.COM</text>

  <!-- Right Panel Background (Paper) -->
  <rect x="740" y="44" width="458.5" height="258" fill="#FFFFFF"/>
  <line x1="740" y1="44" x2="740" y2="302" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Subtle Pixel Weave Accent on Left Panel -->
  <g fill="#FFFFFF" opacity="0.55">
    <rect x="668" y="64" width="8" height="8"/><rect x="684" y="64" width="8" height="8"/><rect x="700" y="64" width="8" height="8"/>
    <rect x="676" y="72" width="8" height="8"/><rect x="692" y="72" width="8" height="8"/><rect x="708" y="72" width="8" height="8"/>
    <rect x="668" y="80" width="8" height="8"/><rect x="684" y="80" width="8" height="8"/><rect x="700" y="80" width="8" height="8"/>
    <rect x="676" y="88" width="8" height="8"/><rect x="692" y="88" width="8" height="8"/><rect x="708" y="88" width="8" height="8"/>
  </g>

  <!-- Exact SMEM Pixel Bitmap Title (scaled 2.8x from 155x36 -> 434x100.8) -->
  <g transform="translate(40, 74) scale(2.8)" fill="#0A0A0A">
    <rect x="5" y="0" width="25" height="4.04"/><rect x="40" y="0" width="10" height="4.04"/><rect x="65" y="0" width="10" height="4.04"/><rect x="80" y="0" width="35" height="4.04"/><rect x="120" y="0" width="10" height="4.04"/><rect x="145" y="0" width="10" height="4.04"/>
    <rect x="0" y="4" width="35" height="4.04"/><rect x="40" y="4" width="15" height="4.04"/><rect x="60" y="4" width="15" height="4.04"/><rect x="80" y="4" width="35" height="4.04"/><rect x="120" y="4" width="15" height="4.04"/><rect x="140" y="4" width="15" height="4.04"/>
    <rect x="0" y="8" width="10" height="4.04"/><rect x="40" y="8" width="35" height="4.04"/><rect x="80" y="8" width="10" height="4.04"/><rect x="120" y="8" width="35" height="4.04"/>
    <rect x="5" y="12" width="25" height="4.04"/><rect x="40" y="12" width="10" height="4.04"/><rect x="55" y="12" width="5" height="4.04"/><rect x="65" y="12" width="10" height="4.04"/><rect x="80" y="12" width="30" height="4.04"/><rect x="120" y="12" width="10" height="4.04"/><rect x="135" y="12" width="5" height="4.04"/><rect x="145" y="12" width="10" height="4.04"/>
    <rect x="10" y="16" width="25" height="4.04"/><rect x="40" y="16" width="10" height="4.04"/><rect x="65" y="16" width="10" height="4.04"/><rect x="80" y="16" width="30" height="4.04"/><rect x="120" y="16" width="10" height="4.04"/><rect x="145" y="16" width="10" height="4.04"/>
    <rect x="25" y="20" width="10" height="4.04"/><rect x="40" y="20" width="10" height="4.04"/><rect x="65" y="20" width="10" height="4.04"/><rect x="80" y="20" width="10" height="4.04"/><rect x="120" y="20" width="10" height="4.04"/><rect x="145" y="20" width="10" height="4.04"/>
    <rect x="0" y="24" width="10" height="4.04"/><rect x="25" y="24" width="10" height="4.04"/><rect x="40" y="24" width="10" height="4.04"/><rect x="65" y="24" width="10" height="4.04"/><rect x="80" y="24" width="10" height="4.04"/><rect x="120" y="24" width="10" height="4.04"/><rect x="145" y="24" width="10" height="4.04"/>
    <rect x="0" y="28" width="35" height="4.04"/><rect x="40" y="28" width="10" height="4.04"/><rect x="65" y="28" width="10" height="4.04"/><rect x="80" y="28" width="35" height="4.04"/><rect x="120" y="28" width="10" height="4.04"/><rect x="145" y="28" width="10" height="4.04"/>
    <rect x="5" y="32" width="25" height="4.04"/><rect x="40" y="32" width="10" height="4.04"/><rect x="65" y="32" width="10" height="4.04"/><rect x="80" y="32" width="35" height="4.04"/><rect x="120" y="32" width="10" height="4.04"/><rect x="145" y="32" width="10" height="4.04"/>
  </g>

  <!-- Left Panel Headline & Subcopy -->
  <text x="40" y="218" fill="#0A0A0A" font-size="24" font-weight="700" class="sans">通用 AI 编程 Agent 统一记忆底座</text>
  <text x="40" y="252" fill="#0A0A0A" font-size="14" font-weight="500" class="sans">让所有 AI 编程助手共同读写同一份透明、可版本化的纯 Markdown 记忆。</text>
  <rect x="40" y="268" width="16" height="6" fill="#2370E8"/>
  <rect x="60" y="268" width="16" height="6" fill="#2BA676"/>
  <rect x="80" y="268" width="16" height="6" fill="#A98BF7"/>
  <rect x="100" y="268" width="16" height="6" fill="#FF5A5A"/>

  <!-- Right Panel: 3 Spec Rows -->
  <!-- Row 1 -->
  <rect x="762" y="64" width="12" height="12" fill="#2370E8"/>
  <text x="784" y="75" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">01 / PURE MARKDOWN</text>
  <text x="762" y="102" fill="#0A0A0A" font-size="14" font-weight="500" class="sans">MEMORY.md + 主题 .md，零数据库、零向量库</text>
  <line x1="740" y1="130" x2="1198.5" y2="130" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Row 2 -->
  <rect x="762" y="150" width="12" height="12" fill="#2BA676"/>
  <text x="784" y="161" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">02 / GO STDLIB &lt; 5MS</text>
  <text x="762" y="188" fill="#0A0A0A" font-size="14" font-weight="500" class="sans">单一静态二进制，OS 文件锁 + ETag + 密钥拦截</text>
  <line x1="740" y1="216" x2="1198.5" y2="216" stroke="#0A0A0A" stroke-width="2"/>

  <!-- Row 3 -->
  <rect x="762" y="236" width="12" height="12" fill="#A98BF7"/>
  <text x="784" y="247" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">03 / 8+ AI CLIENTS</text>
  <text x="762" y="274" fill="#0A0A0A" font-size="14" font-weight="500" class="sans">Claude Code · Codex · Cursor · Gemini · OpenCode</text>

  <!-- Bottom Protocol Bar -->
  <rect x="1.5" y="302" width="1197" height="56.5" fill="#FFFFFF"/>
  <line x1="0" y1="302" x2="1200" y2="302" stroke="#0A0A0A" stroke-width="2"/>

  <rect x="28" y="316" width="16" height="28" fill="#2370E8"/>
  <text x="54" y="335" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">MCP STDIO (5 TOOLS)</text>

  <line x1="270" y1="302" x2="270" y2="358.5" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="294" y="316" width="16" height="28" fill="#2BA676"/>
  <text x="320" y="335" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">LIFECYCLE HOOKS</text>

  <line x1="516" y1="302" x2="516" y2="358.5" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="540" y="316" width="16" height="28" fill="#A98BF7"/>
  <text x="566" y="335" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">RULES &amp; SKILLS</text>

  <line x1="760" y1="302" x2="760" y2="358.5" stroke="#0A0A0A" stroke-width="2"/>
  <rect x="784" y="316" width="16" height="28" fill="#FF5A5A"/>
  <text x="810" y="335" fill="#0A0A0A" font-size="13" font-weight="700" class="mono">GLOBAL + PROJECT + WORKTREE</text>
</svg>
